# Omarchy FOV — system defaults (/etc/omarchy-fov.conf)
# User overrides: ~/.config/omarchy/fov.conf (sourced after this file)
#
# Profiles are TOP BOTTOM LEFT RIGHT pixel margins (desired reserved area,
# including any waybar contribution on the top edge).

VERSION=2.0.0
WAYBAR_NAMESPACE=omarchy-bar
WAYBAR_BASELINE_FALLBACK=30
STATE_DIR="${XDG_STATE_HOME:-$HOME/.local/state}/omarchy"
STATE_FILE="${STATE_DIR}/fov-profile"
LOCK_FILE="${XDG_RUNTIME_DIR:-/tmp}/omarchy-fov.lock"

# Profile margins: TOP BOTTOM LEFT RIGHT
PROFILE_luma="60 60 96 96"
PROFILE_compact="80 80 130 130"
PROFILE_subtle="30 30 50 50"
PROFILE_full="30 0 0 0"

# Cycle order for SUPER+F11 / `omarchy-fov toggle`
PROFILE_CYCLE="full subtle luma compact"

# hyprctl eval template. Placeholders: %OUTPUT% %TOP% %RIGHT% %BOTTOM% %LEFT%
# Top is already compensated for waybar baseline before substitution.
EVAL_TEMPLATE="hl.monitor({ output = '%OUTPUT%', reserved = { top = %TOP%, right = %RIGHT%, bottom = %BOTTOM%, left = %LEFT% } })"
