# ==============================================================================
# /etc/systemd/zram-generator.conf
# Omarchy Quatro Pi 5 (8GB RAM Target) - ZRAM Swap Configuration
#
# Generates a 4GB in-memory swap device using zstd compression.
# Eliminates NVMe disk write thrashing under heavy multitasking workloads,
# maximizes system responsiveness, and dramatically extends SSD flash endurance.
# ==============================================================================

[zram0]
# Allocate 4GB (4096MB) compressed swap partition in RAM
zram-size = 4096

# Use zstd (Zstandard) compression algorithm: optimal balance of CPU efficiency and compression ratio
compression-algorithm = zstd

# Set swap priority to 100 so zram is preferred over any secondary NVMe/disk swap files
swap-priority = 100

# Format as swap
fs-type = swap
