# ==============================================================================
# /etc/sysctl.d/99-pi5-sysctl.conf
# Omarchy Quatro Pi 5 (8GB RAM + NVMe Target) - Memory & I/O Kernel Tuning
# ==============================================================================

# Aggressively swap cold/inactive anonymous memory into 4GB zstd zram device
# instead of dropping active filesystem page caches from physical RAM.
vm.swappiness=100

# Keep directory and inode VFS metadata caches in memory longer (default: 100).
# Substantially accelerates filesystem navigation, indexing, and git operations.
vm.vfs_cache_pressure=50

# Begin background asynchronous kernel writeout when dirty pages reach 5% of RAM (~400MB on 8GB).
# Prevents large bursty write flushes that cause NVMe I/O micro-stutters.
vm.dirty_background_ratio=5

# Hard limit for dirty pages before processes block on synchronous disk writes (10% of RAM, ~800MB).
# Prevents memory exhaustion from runaway write queues during heavy I/O workloads.
vm.dirty_ratio=10
