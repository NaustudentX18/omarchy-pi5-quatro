# ==============================================================================
# /etc/sysctl.d/99-pi5-sysctl.conf
# Omarchy Quattro Pi 5 (8GB RAM + NVMe Target) - Memory & I/O Kernel Tuning
# ==============================================================================

# Aggressively swap cold/inactive anonymous memory into 4GB zstd zram device
# instead of dropping active filesystem page caches from physical RAM.
vm.swappiness=100

# Keep directory and inode VFS metadata caches in memory longer (default: 100).
# Substantially accelerates filesystem navigation, indexing, and git operations.
vm.vfs_cache_pressure=50

# dirty_background_bytes takes precedence over dirty_background_ratio when set,
# so we specify an explicit byte budget rather than a percentage of RAM. On a
# 4 GB Pi 5 the old `dirty_background_ratio=5` translated to ~200 MB; on 8 GB it
# translated to ~400 MB. An absolute 200 MB keeps the writeback target stable
# across both SKUs and prevents 4 GB builds from triggering writeback too
# late. For 16 GB Pi 5 SKUs tune this up (e.g. 400-800 MB) via
# apply_tuning.sh's RAM detection.
vm.dirty_background_bytes=209715200


# Hard limit for dirty pages before processes block on synchronous disk writes.
# Kept as a percentage so it scales with RAM (10% = 400MB on 4GB, 800MB on
# 8GB, 1.6GB on 16GB). Prevents memory exhaustion from runaway write queues
# during heavy I/O workloads.
vm.dirty_ratio=10
