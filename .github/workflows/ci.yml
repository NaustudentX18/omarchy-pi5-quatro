name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint:
    name: Shell & config lint
    runs-on: ubuntu-latest
    # NOTE: End-to-end image build verification is NOT in CI.
    # The build runs as root with privileged loop devices, which GitHub-hosted runners can't provide.
    # Manual build verification on a real Pi 5 is required before each release.
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck build scripts
        run: |
          shellcheck --severity=style --enable=add-default-case,deprecate-which,quote-safe-variables build_pi5_image.sh build_docker.sh desktop/*.sh argon/*.sh resize/*.sh system_tuning/*.sh

      - name: Hadolint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Bash syntax check (strict)
        run: |
          for f in build_pi5_image.sh build_docker.sh desktop/*.sh argon/*.sh resize/*.sh system_tuning/*.sh; do
            bash -n "$f"
          done

      - name: Validate Imager OS list JSON
        run: python3 -m json.tool pi-imager-os-list.json > /dev/null

      - name: Validate package manifest
        run: |
          # every non-comment line must be a plausible pacman package name
          bad=$(grep -vE '^\s*(#|$)' desktop/packages.list | grep -vE '^[a-zA-Z0-9_-]+$' || true)
          if [ -n "$bad" ]; then echo "Invalid package entries:"; echo "$bad"; exit 1; fi
          count=$(grep -cvE '^\s*(#|$)' desktop/packages.list)
          echo "packages.list OK ($count packages)"
